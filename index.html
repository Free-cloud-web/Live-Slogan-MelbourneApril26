<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Rally Live</title>

<style>
body {
  margin:0;
  background:black;
  color:white;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  height:100vh;
  font-family:Arial;
}

#main {
  font-size:7vw;
  font-weight:bold;
  text-align:center;
}

#timer {
  font-size:2vw;
  color:yellow;
  margin-top:10px;
}

#next {
  font-size:1.8vw;
  color:#aaa;
  margin-top:8px;
}

#admin {
  position:fixed;
  bottom:10px;
  right:10px;
  display:none;
  background:rgba(0,0,0,0.9);
  padding:16px;
  border-radius:16px;
}

button {
  margin:10px;
  padding:28px 36px;
  font-size:24px;
  border-radius:16px;
  border:none;
  font-weight:bold;
}
</style>
</head>

<body>

<div id="main"></div>
<div id="timer"></div>
<div id="next"></div>

<div id="admin">
  <button onclick="startShow()">START</button>
  <button onclick="resetShow()">RESET</button>
  <button onclick="setHold(true)">HOLD</button>
  <button onclick="setHold(false)">RESUME</button>
  <button onclick="jump(1)">B1</button>
  <button onclick="jump(2)">B2</button>
  <button onclick="jump(3)">B3</button>
  <button onclick="jump(4)">B4</button>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCJH-Ev5S2oykfw7r5vYCf10_BlB8quoa0",
  authDomain: "rallycontrol-550d4.firebaseapp.com",
  databaseURL: "https://rallycontrol-550d4-default-rtdb.firebaseio.com",
  projectId: "rallycontrol-550d4",
  storageBucket: "rallycontrol-550d4.appspot.com",
  messagingSenderId: "966562447046",
  appId: "1:966562447046:web:f69b32312f9c5d627fe1c7"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const controlRef = ref(db, "control");

let hold = false;
let block = 1;
let startTime = 0;
let blockStart = 0;

onValue(controlRef, (snap)=>{
  const d = snap.val();
  if(!d) return;

  hold = d.hold || false;
  block = d.block || 1;
  startTime = d.startTime || 0;
  blockStart = d.blockStart || 0;
});

/* ADMIN */
let press;
document.body.addEventListener("mousedown", start);
document.body.addEventListener("mouseup", stop);
document.body.addEventListener("touchstart", start);
document.body.addEventListener("touchend", stop);

function start(){
  press = setTimeout(()=>{
    let code = prompt("Admin code");
    if(code==="26-04"){
      document.getElementById("admin").style.display="block";
    }
  },2000);
}
function stop(){ clearTimeout(press); }

window.setHold = setHold;
window.jump = jump;
window.startShow = startShow;
window.resetShow = resetShow;

/* START */
function startShow(){
  let now = Date.now();
  update(controlRef, {
    hold:false,
    block:1,
    startTime: now,
    blockStart: now
  });
}

/* RESET */
function resetShow(){
  update(controlRef, {
    hold:false,
    block:1,
    startTime:0,
    blockStart:0
  });
}

/* HOLD */
function setHold(v){
  update(controlRef, {
    hold:v
  });
}

/* BLOCK CHANGE */
function jump(b){
  update(controlRef, {
    hold:false,
    block:b,
    blockStart: Date.now()
  });
}

/* UI */
function show(txt, sec, next){
  document.getElementById("main").innerText = txt;
  document.getElementById("timer").innerText = sec ? sec + "s" : "";
  document.getElementById("next").innerText = next ? "Next slogan: " + next + "s" : "";
}

/* MAIN LOOP */
function run(){

  if(!startTime){
    show("⏳ STARTING SOON","",0);
    return;
  }

  if(hold){
    show("⏸ HOLD","",0);
    return;
  }

  let t = Date.now() - blockStart;

  function calc(list, duration){

    let index = Math.floor(t / duration) % list.length;

    let currentText = list[index];

    let timeInCycle = t % duration;
    let nextIn = Math.ceil((duration - timeInCycle) / 1000);

    show(currentText, nextIn, nextIn);

  }

  /* BLOCKS */

  if(block===1){
    calc([
      "Freedom! Freedom!",
      "Long live Iran!",
      "Free Iran!",
      "Internet is our right!",
      "JAAVID SHAH"
    ],30000);
    return;
  }

  if(block===2){
    calc([
      "What do we want → Freedom",
      "When do we want → NOW",
      "Regime change → NOW",
      "Stand up Fight back"
    ],30000);
    return;
  }

  if(block===3){
    calc([
      "Free Iran!",
      "No to dictatorship!",
      "Down with regime!",
      "Freedom is our right"
    ],10000);
    return;
  }

  if(block===4){
    calc([
      "Long live Iran!",
      "JAAVID SHAH",
      "KING REZA PAHLAVI"
    ],30000);
    return;
  }

  show("LIVE","",0);
}

setInterval(run,1000);
run();

</script>
</body>
</html>
