<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Rally Live</title>

<style>
body {
  margin:0;
  background:black;
  color:white;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  height:100vh;
  font-family:Arial;
}

#main {
  font-size:7vw;
  font-weight:bold;
  text-align:center;
}

#timer {
  font-size:2vw;
  color:yellow;
  margin-top:10px;
}

/* 🔥 ADMIN PANEL */
#admin {
  position:fixed;
  bottom:10px;
  right:10px;
  display:none;
  background:rgba(0,0,0,0.92);
  padding:16px;
  border-radius:16px;
}

/* 🔥 BIG BUTTONS */
button {
  margin:10px;
  padding:28px 36px;
  font-size:24px;
  border-radius:16px;
  border:none;
  font-weight:bold;
}
</style>
</head>

<body>

<div id="main"></div>
<div id="timer"></div>

<div id="admin">
  <button onclick="startShow()">START</button>
  <button onclick="resetShow()">RESET</button>
  <button onclick="setHold(true)">HOLD</button>
  <button onclick="setHold(false)">RESUME</button>
  <button onclick="jump(1)">B1</button>
  <button onclick="jump(2)">B2</button>
  <button onclick="jump(3)">B3</button>
  <button onclick="jump(4)">B4</button>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

/* 🔥 FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyCJH-Ev5S2oykfw7r5vYCf10_BlB8quoa0",
  authDomain: "rallycontrol-550d4.firebaseapp.com",
  databaseURL: "https://rallycontrol-550d4-default-rtdb.firebaseio.com",
  projectId: "rallycontrol-550d4",
  storageBucket: "rallycontrol-550d4.appspot.com",
  messagingSenderId: "966562447046",
  appId: "1:966562447046:web:f69b32312f9c5d627fe1c7"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const controlRef = ref(db, "control");

/* STATE */
let hold = false;
let block = 1;
let startTime = 0;
let blockStart = 0;

/* 🔥 SYNC */
onValue(controlRef, (snap)=>{
  const d = snap.val();
  if(!d) return;

  hold = d.hold || false;
  block = d.block || 1;
  startTime = d.startTime || 0;
  blockStart = d.blockStart || 0;
});

/* 🔥 ADMIN UNLOCK */
let press;
document.body.addEventListener("mousedown", start);
document.body.addEventListener("mouseup", stop);
document.body.addEventListener("touchstart", start);
document.body.addEventListener("touchend", stop);

function start(){
  press = setTimeout(()=>{
    let code = prompt("Admin code");
    if(code==="2604"){
      document.getElementById("admin").style.display="block";
    }
  },2000);
}
function stop(){ clearTimeout(press); }

/* GLOBAL ACCESS */
window.setHold = setHold;
window.jump = jump;
window.startShow = startShow;
window.resetShow = resetShow;

/* 🔥 START SHOW */
function startShow(){
  let now = Date.now();

  update(controlRef, {
    hold:false,
    block:1,
    startTime: now,
    blockStart: now
  });
}

/* 🔥 RESET → WAITING STATE */
function resetShow(){
  update(controlRef, {
    hold:false,
    block:1,
    startTime:0,
    blockStart:0
  });
}

/* 🔥 HOLD (FREEZE/RESUME PROPERLY) */
function setHold(v){

  if(v){
    update(controlRef, {
      hold:true,
      blockStart: Date.now()
    });
  } else {
    update(controlRef, {
      hold:false,
      blockStart: Date.now()
    });
  }
}

/* 🔥 BLOCK SWITCH (FIXED) */
function jump(b){

  let now = Date.now();

  update(controlRef, {
    hold:false,
    block:b,
    blockStart: now
  });
}

/* UI */
function show(txt, sec){
  document.getElementById("main").innerText = txt;
  document.getElementById("timer").innerText = sec ? sec+"s" : "";
}

/* 🔥 MAIN LOOP */
function run(){

  if(!startTime){
    show("⏳ STARTING SOON","Waiting for host...");
    return;
  }

  if(hold){
    show("⏸ HOLD","");
    return;
  }

  let t = Date.now() - blockStart;

  /* BLOCK 1 */
  if(block===1){
    let list=[
      "Freedom! Freedom!",
      "Long live Iran!",
      "Free Iran!",
      "Internet is our right!",
      "JAAVID SHAH"
    ];
    let d=30000;
    let i=Math.floor(t/d)%list.length;
    let r=Math.ceil((d-(t%d))/1000);
    show(list[i],r); return;
  }

  /* BLOCK 2 */
  if(block===2){
    let list=[
      "What do we want → Freedom",
      "When do we want → NOW",
      "Regime change → NOW",
      "Stand up Fight back"
    ];
    let d=30000;
    let i=Math.floor(t/d)%list.length;
    let r=Math.ceil((d-(t%d))/1000);
    show(list[i],r); return;
  }

  /* BLOCK 3 */
  if(block===3){
    let list=[
      "Free Iran!",
      "No to dictatorship!",
      "Down with regime!",
      "Freedom is our right"
    ];
    let d=10000;
    let i=Math.floor(t/d)%list.length;
    let r=Math.ceil((t%d)/1000);
    show(list[i],r); return;
  }

  /* BLOCK 4 */
  if(block===4){
    let list=[
      "Long live Iran!",
      "JAAVID SHAH",
      "KING REZA PAHLAVI"
    ];
    let d=30000;
    let i=Math.floor(t/d)%list.length;
    let r=Math.ceil((d-(t%d))/1000);
    show(list[i],r); return;
  }

  show("LIVE","");

}

setInterval(run,1000);
run();

</script>
</body>
</html>
