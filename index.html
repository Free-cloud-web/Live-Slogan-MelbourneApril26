<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Rally Live</title>

<style>
body {
  margin:0;
  background:black;
  color:white;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  height:100vh;
  font-family:Arial;
}

#main { font-size:7vw; font-weight:bold; text-align:center; }
#timer { font-size:2vw; color:yellow; margin-top:10px; }

#admin {
  position:fixed;
  bottom:20px;
  right:20px;
  display:none;
}
button { margin:5px; padding:6px; }
</style>
</head>

<body>

<div id="main"></div>
<div id="timer"></div>

<div id="admin">
  <button onclick="setHold(true)">HOLD</button>
  <button onclick="setHold(false)">RESUME</button>
  <button onclick="jump(1)">B1</button>
  <button onclick="jump(2)">B2</button>
  <button onclick="jump(3)">B3</button>
  <button onclick="jump(4)">B4</button>
  <button onclick="jump(5)">B5</button>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

/* 🔥 YOUR CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyCJH-Ev5S2oykfw7r5vYCf10_BlB8quoa0",
  authDomain: "rallycontrol-550d4.firebaseapp.com",
  databaseURL: "https://rallycontrol-550d4-default-rtdb.firebaseio.com",
  projectId: "rallycontrol-550d4",
  storageBucket: "rallycontrol-550d4.firebasestorage.app",
  messagingSenderId: "966562447046",
  appId: "1:966562447046:web:f69b32312f9c5d627fe1c7"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const controlRef = ref(db, "control");

/* GLOBAL STATE (SYNCED) */
let hold = false;
let block = 0;

/* 🔥 REALTIME SYNC */
onValue(controlRef, (snap)=>{
  const d = snap.val();
  if(!d) return;
  hold = d.hold;
  block = d.block;
});

/* ADMIN ACCESS */
let press;
document.body.addEventListener("mousedown", start);
document.body.addEventListener("mouseup", stop);
document.body.addEventListener("touchstart", start);
document.body.addEventListener("touchend", stop);

function start(){
  press = setTimeout(()=>{
    let code = prompt("Admin code");
    if(code==="26-04"){
      document.getElementById("admin").style.display="block";
    }
  },3000);
}
function stop(){ clearTimeout(press); }

/* 🔥 ADMIN ACTIONS (GLOBAL FOR ALL USERS) */
function setHold(v){
  set(controlRef, { hold:v, block:block, pause:false });
}

function jump(b){
  set(controlRef, { hold:false, block:b, pause:false });
}

/* TIME BASE */
let startTime = new Date("2026-04-25T15:00:00+10:00").getTime();

function show(txt, sec){
  document.getElementById("main").innerText = txt;
  document.getElementById("timer").innerText = sec ? sec+"s" : "";
}

/* CORE LOOP */
function run(){

  if(hold){
    show("⏸ HOLD","");
    return;
  }

  let t = Date.now() - startTime;
  let min = Math.floor(t/60000);

  /* BLOCK 1 */
  if(min<20 || block===1){
    let list=[
      "Freedom! Freedom!",
      "Long live Iran!",
      "Free Iran!",
      "Melbourne stands with Iran",
      "Internet is our right!",
      "Freedom is our right!",
      "JAAVID SHAH",
      "KING REZA PAHLAVI"
    ];
    let d=30000;
    let i=Math.floor(t/d)%list.length;
    let r=Math.ceil((d-(t%d))/1000);
    show(list[i],r); return;
  }

  /* BLOCK 2 */
  if(min<30 || block===2){
    let list=[
      "What do we want → Freedom",
      "When do we want → NOW",
      "What do we want → Regime change",
      "When do we want → NOW",
      "NOW NOW NOW",
      "Stand up Fight back",
      "JAAVID SHAH",
      "KING REZA PAHLAVI"
    ];
    let d=30000;
    let i=Math.floor(t/d)%list.length;
    let r=Math.ceil((d-(t%d))/1000);
    show(list[i],r); return;
  }

  /* BLOCK 3 */
  if(min<75 || block===3){
    let list=[
      "Free Iran!",
      "We won't be silent!",
      "No to dictatorship!",
      "Down with regime!",
      "Free internet!",
      "Freedom is our right!",
      "Say his name",
      "Reza Pahlavi"
    ];
    let d=10000;
    let i=Math.floor(t/d)%list.length;
    let r=Math.ceil((d-(t%d))/1000);
    show(list[i],r); return;
  }

  /* BLOCK 4 */
  if(min<90 || block===4){
    let list=[
      "Long live Iran!",
      "Free Iran!",
      "Until Iran is free!",
      "JAAVID SHAH",
      "KING REZA PAHLAVI"
    ];
    let d=30000;
    let i=Math.floor(t/d)%list.length;
    let r=Math.ceil((d-(t%d))/1000);
    show(list[i],r); return;
  }

  /* FINAL */
  let list=[
    "What do we want → Freedom",
    "When do we want → NOW",
    "Iran’s voice → Iran’s choice → Reza Pahlavi",
    "Long live Iran",
    "Freedom!",
    "Until Iran is free",
    "We won’t stop"
  ];
  let d=30000;
  let i=Math.floor(t/d)%list.length;
  let r=Math.ceil((d-(t%d))/1000);
  show(list[i],r);
}

setInterval(run,1000);
run();

</script>
</body>
</html>
