<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Rally System</title>

<style>
body {
  margin: 0;
  background: black;
  color: white;
  font-family: Arial;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  flex-direction: column;
  text-align: center;
}

#main {
  font-size: 7vw;
  font-weight: bold;
}

#sub {
  font-size: 3vw;
  margin-top: 20px;
  color: yellow;
}

#adminPanel {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: rgba(0,0,0,0.9);
  border: 1px solid white;
  padding: 10px;
  display: none;
  flex-direction: column;
  gap: 10px;
}

button {
  padding: 8px;
  font-size: 14px;
}
</style>
</head>

<body>

<div id="main"></div>
<div id="sub"></div>

<div id="adminPanel">
  <button onclick="pause()">Pause</button>
  <button onclick="resume()">Resume</button>
  <button onclick="hold()">Hold</button>
  <button onclick="go(1)">Block 1</button>
  <button onclick="go(2)">Block 2</button>
  <button onclick="go(3)">Block 3</button>
  <button onclick="go(4)">Block 4</button>
  <button onclick="go(5)">Final</button>
</div>

<script>
/* =========================
   TIME CONFIG (Melbourne 3PM)
========================= */
const START = new Date("2026-04-25T15:00:00+10:00").getTime();

let paused = false;
let holdMode = false;
let manualBlock = null;
let pauseTime = 0;

/* =========================
   ADMIN ACCESS (long press)
========================= */
let pressTimer;

document.body.addEventListener("mousedown", startPress);
document.body.addEventListener("mouseup", cancelPress);
document.body.addEventListener("touchstart", startPress);
document.body.addEventListener("touchend", cancelPress);

function startPress() {
  pressTimer = setTimeout(() => {
    const code = prompt("Admin Code:");
    if (code === "2604") {
      document.getElementById("adminPanel").style.display = "flex";
    }
  }, 3000);
}

function cancelPress() {
  clearTimeout(pressTimer);
}

/* =========================
   ADMIN FUNCTIONS
========================= */
function pause() {
  paused = true;
  pauseTime = Date.now();
}

function resume() {
  if (paused) {
    START += (Date.now() - pauseTime);
  }
  paused = false;
}

function hold() {
  holdMode = !holdMode;
}

function go(b) {
  manualBlock = b;
}

/* =========================
   DISPLAY
========================= */
function show(main, sub="") {
  document.getElementById("main").innerText = main;
  document.getElementById("sub").innerText = sub;
}

/* =========================
   SYSTEM LOOP
========================= */
setInterval(run, 1000);

function run() {
  if (paused) return;

  const now = Date.now();
  const t = now - START;

  if (t < 0) {
    show("RALLY STARTS SOON", "");
    return;
  }

  const min = Math.floor(t / 60000);

  /* =========================
     BLOCK 1 (0–20 min)
  ========================= */
  if (min < 20 || manualBlock === 1) {
    const list = [
      "Freedom! Freedom!",
      "Long live Iran!",
      "Free Iran!",
      "Melbourne stands with Iran",
      "Internet is our right!",
      "Freedom is our right!",
      "JAAVID SHAH",
      "KING REZA PAHLAVI"
    ];

    const i = Math.floor(t / 30000) % list.length;
    show(list[i]);
    return;
  }

  /* =========================
     BLOCK 2 (20–30 min)
  ========================= */
  if (min < 30 || manualBlock === 2) {
    const list = [
      "What do we want? → Freedom!",
      "When do we want it? → NOW!",
      "What do we want? → Regime change!",
      "When do we want it? → NOW!",
      "NOW! NOW! NOW!",
      "Stand up! Fight back!",
      "JAAVID SHAH",
      "KING REZA PAHLAVI"
    ];

    const i = Math.floor(t / 30000) % list.length;
    show(list[i]);
    return;
  }

  /* =========================
     BLOCK 3 (MARCH 30–75)
  ========================= */
  if (min < 75 || manualBlock === 3) {
    const waves = [
      [
        "Free Iran!",
        "We won't be silent!",
        "JAAVID SHAH"
      ],
      [
        "No to regime!",
        "Down with dictatorship!",
        "KING REZA PAHLAVI"
      ],
      [
        "Free internet!",
        "Freedom is our right!",
        "JAAVID SHAH"
      ],
      [
        "Say his name",
        "Reza Pahlavi",
        "KING REZA PAHLAVI"
      ]
    ];

    const w = Math.floor(t / 420000) % waves.length;
    const i = Math.floor(t / 10000) % waves[w].length;

    show(waves[w][i]);
    return;
  }

  /* =========================
     BLOCK 4 (Arrival)
  ========================= */
  if (min < 90 || manualBlock === 4) {
    const list = [
      "Long live Iran!",
      "Free Iran!",
      "Until Iran is free!",
      "JAAVID SHAH",
      "KING REZA PAHLAVI"
    ];

    const i = Math.floor(t / 30000) % list.length;
    show(list[i]);
    return;
  }

  /* =========================
     BLOCK 5 (FINAL / SPEECH)
  ========================= */
  if (manualBlock === 5 || min >= 90) {

    if (holdMode) {
      show("SPEECH MODE", "HOLD ACTIVE");
      return;
    }

    const list = [
      "What do we want → Freedom",
      "When do we want it → NOW",
      "Iran’s voice → Iran’s choice → Reza Pahlavi",
      "Long live Iran",
      "Freedom!",
      "Until Iran is free",
      "We won’t stop"
    ];

    const i = Math.floor(t / 30000) % list.length;
    show(list[i]);
    return;
  }
}
</script>

</body>
</html>
