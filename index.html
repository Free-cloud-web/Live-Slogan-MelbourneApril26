<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Rally System</title>

<style>
body {
  margin: 0;
  background: black;
  color: white;
  font-family: Arial;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  flex-direction: column;
  text-align: center;
}

#main {
  font-size: 7vw;
  font-weight: bold;
}

#timer {
  font-size: 2vw;
  margin-top: 15px;
  color: yellow;
}

#admin {
  position: fixed;
  bottom: 20px;
  right: 20px;
  display: none;
  background: rgba(0,0,0,0.9);
  border: 1px solid white;
  padding: 10px;
}

button {
  margin: 5px;
}
</style>
</head>

<body>

<div id="main"></div>
<div id="timer"></div>

<div id="admin">
  <button onclick="pause()">Pause</button>
  <button onclick="resume()">Resume</button>
  <button onclick="toggleHold()">Hold</button>
  <button onclick="jump(1)">B1</button>
  <button onclick="jump(2)">B2</button>
  <button onclick="jump(3)">B3</button>
  <button onclick="jump(4)">B4</button>
  <button onclick="jump(5)">B5</button>
</div>

<script>
let startTime = new Date("2026-04-25T15:00:00+10:00").getTime();

let paused = false;
let hold = false;
let pauseOffset = 0;
let manualBlock = null;

/* LONG PRESS ADMIN */
let timerPress;
document.body.addEventListener("mousedown", startPress);
document.body.addEventListener("mouseup", cancelPress);
document.body.addEventListener("touchstart", startPress);
document.body.addEventListener("touchend", cancelPress);

function startPress(){
  timerPress = setTimeout(()=>{
    let code = prompt("Admin Code");
    if(code==="26-04"){
      document.getElementById("admin").style.display="block";
    }
  },3000);
}
function cancelPress(){
  clearTimeout(timerPress);
}

/* ADMIN */
function pause(){
  paused = true;
}
function resume(){
  paused = false;
}
function toggleHold(){
  hold = !hold;
}
function jump(b){
  manualBlock = b;
}

/* DISPLAY */
function show(text, remaining){
  document.getElementById("main").innerText = text;
  document.getElementById("timer").innerText = remaining + "s";
}

/* CORE */
function run(){
  if(paused) return;

  let now = Date.now();
  let t = now - startTime - pauseOffset;

  if(hold){
    return;
  }

  if(t < 0){
    show("STARTING SOON", Math.floor(-t/1000));
    return;
  }

  let min = Math.floor(t/60000);

  /* BLOCK 1 */
  if(min < 20 || manualBlock === 1){
    let list = [
      "Freedom! Freedom!",
      "Long live Iran!",
      "Free Iran!",
      "Melbourne stands with Iran",
      "Internet is our right!",
      "Freedom is our right!",
      "JAAVID SHAH",
      "KING REZA PAHLAVI"
    ];

    let duration = 30000;
    let index = Math.floor(t/duration) % list.length;
    let remain = Math.ceil((duration - (t % duration))/1000);

    show(list[index], remain);
    return;
  }

  /* BLOCK 2 */
  if(min < 30 || manualBlock === 2){
    let list = [
      "What do we want → Freedom",
      "When do we want → NOW",
      "What do we want → Regime change",
      "When do we want → NOW",
      "NOW NOW NOW",
      "Stand up Fight back",
      "JAAVID SHAH",
      "KING REZA PAHLAVI"
    ];

    let duration = 30000;
    let index = Math.floor(t/duration) % list.length;
    let remain = Math.ceil((duration - (t % duration))/1000);

    show(list[index], remain);
    return;
  }

  /* BLOCK 3 */
  if(min < 75 || manualBlock === 3){
    let list = [
      "Free Iran!",
      "We won't be silent!",
      "No to dictatorship!",
      "Down with regime!",
      "Free internet!",
      "Freedom is our right!",
      "Say his name",
      "Reza Pahlavi"
    ];

    let duration = 10000;
    let index = Math.floor(t/duration) % list.length;
    let remain = Math.ceil((duration - (t % duration))/1000);

    show(list[index], remain);
    return;
  }

  /* BLOCK 4 */
  if(min < 90 || manualBlock === 4){
    let list = [
      "Long live Iran!",
      "Free Iran!",
      "Until Iran is free!",
      "JAAVID SHAH",
      "KING REZA PAHLAVI"
    ];

    let duration = 30000;
    let index = Math.floor(t/duration) % list.length;
    let remain = Math.ceil((duration - (t % duration))/1000);

    show(list[index], remain);
    return;
  }

  /* BLOCK 5 */
  if(manualBlock === 5 || min >= 90){
    let list = [
      "What do we want → Freedom",
      "When do we want → NOW",
      "Iran’s voice → Iran’s choice → Reza Pahlavi",
      "Long live Iran",
      "Freedom!",
      "Until Iran is free",
      "We won’t stop"
    ];

    let duration = 30000;
    let index = Math.floor(t/duration) % list.length;
    let remain = Math.ceil((duration - (t % duration))/1000);

    show(list[index], remain);
    return;
  }
}

setInterval(run,1000);
run();
</script>

</body>
</html>
