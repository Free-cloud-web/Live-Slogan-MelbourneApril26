<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Rally Live</title>

<style>
body {
  margin:0;
  background:black;
  color:white;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  height:100vh;
  font-family:Arial;
}

#main {
  font-size:7vw;
  font-weight:bold;
  text-align:center;
}

#timer {
  font-size:2vw;
  color:yellow;
  margin-top:10px;
}

/* 🔥 MOBILE FRIENDLY ADMIN */
#admin {
  position:fixed;
  bottom:10px;
  right:10px;
  display:none;
  background:rgba(0,0,0,0.85);
  padding:12px;
  border-radius:12px;
}

/* 🔥 BIG BUTTONS */
button {
  margin:8px;
  padding:18px 22px;
  font-size:18px;
  border-radius:12px;
  border:none;
}
</style>
</head>

<body>

<div id="main"></div>
<div id="timer"></div>

<div id="admin">
  <button onclick="startShow()">START</button>
  <button onclick="setHold(true)">HOLD</button>
  <button onclick="setHold(false)">RESUME</button>
  <button onclick="jump(1)">B1</button>
  <button onclick="jump(2)">B2</button>
  <button onclick="jump(3)">B3</button>
  <button onclick="jump(4)">B4</button>
  <button onclick="jump(5)">B5</button>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

/* 🔥 FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyCJH-Ev5S2oykfw7r5vYCf10_BlB8quoa0",
  authDomain: "rallycontrol-550d4.firebaseapp.com",
  databaseURL: "https://rallycontrol-550d4-default-rtdb.firebaseio.com",
  projectId: "rallycontrol-550d4",
  storageBucket: "rallycontrol-550d4.appspot.com",
  messagingSenderId: "966562447046",
  appId: "1:966562447046:web:f69b32312f9c5d627fe1c7"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const controlRef = ref(db, "control");

/* STATE */
let hold = false;
let block = 1;
let started = false;
let startTime = 0;

/* REALTIME SYNC */
onValue(controlRef, (snap)=>{
  const d = snap.val();
  if(!d) return;
  hold = d.hold || false;
  block = d.block || 1;
});

/* ADMIN LOGIN (long press) */
let press;
document.body.addEventListener("mousedown", start);
document.body.addEventListener("mouseup", stop);
document.body.addEventListener("touchstart", start);
document.body.addEventListener("touchend", stop);

function start(){
  press = setTimeout(()=>{
    let code = prompt("Admin code");
    if(code==="26-04"){
      document.getElementById("admin").style.display="block";
    }
  },2000);
}
function stop(){ clearTimeout(press); }

/* MAKE FUNCTIONS GLOBAL (IMPORTANT FIX) */
window.setHold = setHold;
window.jump = jump;
window.startShow = startShow;

/* ADMIN ACTIONS */
function setHold(v){
  update(controlRef, { hold:v, block:block });
}

function jump(b){
  update(controlRef, { hold:false, block:b });
}

function startShow(){
  startTime = Date.now();
  started = true;
  update(controlRef, { hold:false, block:1 });
}

/* UI */
function show(txt, sec){
  document.getElementById("main").innerText = txt;
  document.getElementById("timer").innerText = sec ? sec+"s" : "";
}

/* LOOP */
function run(){

  if(!started){
    show("⏳ STARTING SOON","LIVE will begin shortly");
    return;
  }

  if(hold){
    show("⏸ HOLD","");
    return;
  }

  let t = Date.now() - startTime;
  let min = Math.floor(t/60000);

  /* BLOCK 1 */
  if(min<20 || block===1){
    let list=[
      "Freedom! Freedom!",
      "Long live Iran!",
      "Free Iran!",
      "Internet is our right!",
      "Freedom is our right!",
      "JAAVID SHAH",
      "KING REZA PAHLAVI"
    ];
    let d=30000;
    let i=Math.floor(t/d)%list.length;
    let r=Math.ceil((d-(t%d))/1000);
    show(list[i],r); return;
  }

  /* BLOCK 2 */
  if(min<30 || block===2){
    let list=[
      "What do we want → Freedom",
      "When do we want → NOW",
      "Regime change → NOW",
      "Stand up Fight back",
      "JAAVID SHAH",
      "KING REZA PAHLAVI"
    ];
    let d=30000;
    let i=Math.floor(t/d)%list.length;
    let r=Math.ceil((d-(t%d))/1000);
    show(list[i],r); return;
  }

  /* BLOCK 3 */
  if(min<75 || block===3){
    let list=[
      "Free Iran!",
      "We won't be silent!",
      "No to dictatorship!",
      "Down with regime!",
      "Free internet!",
      "Reza Pahlavi"
    ];
    let d=10000;
    let i=Math.floor(t/d)%list.length;
    let r=Math.ceil((t%d)/1000);
    show(list[i],r); return;
  }

  /* BLOCK 4 */
  if(min<90 || block===4){
    let list=[
      "Long live Iran!",
      "Free Iran!",
      "JAAVID SHAH",
      "KING REZA PAHLAVI"
    ];
    let d=30000;
    let i=Math.floor(t/d)%list.length;
    let r=Math.ceil((d-(t%d))/1000);
    show(list[i],r); return;
  }

  /* FINAL */
  let list=[
    "What do we want → Freedom",
    "When do we want → NOW",
    "Long live Iran",
    "We won't stop"
  ];

  let d=30000;
  let i=Math.floor(t/d)%list.length;
  let r=Math.ceil((d-(t%d))/1000);
  show(list[i],r);
}

setInterval(run,1000);
run();

</script>

</body>
</html>
